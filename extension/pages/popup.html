<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Deteksi Konten</title>
  <style>
    :root {
      --primary: #0ea5e9;
      /* Light Blue */
      --primary-hover: #0284c7;
      --success: #10b981;
      /* Emerald Green */
      --success-hover: #059669;
      --danger: #ef4444;
      --bg-gradient-start: #e0f2fe;
      /* Very light blue */
      --bg-gradient-end: #d1fae5;
      /* Very light green */
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #334155;
    }

    body {
      width: 320px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-main);
      box-sizing: border-box;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    .header svg {
      width: 24px;
      height: 24px;
    }

    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .container {
      padding: 20px;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .status-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
    }

    .status-box p {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #status-text {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .report-section {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .report-section h4 {
      margin: 0 0 16px 0;
      font-size: 14px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .report-section h4 svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    .input-group {
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
      font-size: 14px;
      box-sizing: border-box;
      background: #f8fafc;
      color: var(--text-main);
      transition: all 0.3s ease;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
      background: #ffffff;
    }

    input[type="password"] {
      text-align: center;
      letter-spacing: 8px;
      font-size: 20px;
      font-weight: 700;
    }

    input[type="password"]::placeholder {
      letter-spacing: normal;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--success), var(--success-hover));
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      margin-top: 5px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .msg.success {
      background: #d1fae5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .msg.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <h2>Deteksi Konten</h2>
  </div>

  <div class="container">
    <div class="status-box">
      <p>Status Situs Saat Ini</p>
      <h3 id="status-text">Menganalisis...</h3>
    </div>

    <div class="report-section">
      <h4>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
        Kontrol Admin
      </h4>
      <div class="input-group">
        <input type="password" id="admin-pin" maxlength="4" placeholder="Masukkan 4 Digit PIN">
      </div>
      <div class="input-group">
        <select id="admin-label">
          <option value="0">Normal (Aman)</option>
          <option value="1">Judi Online</option>
          <option value="2">Pornografi</option>
          <option value="3">Pembajakan</option>
        </select>
      </div>
      <button id="admin-btn">Ubah Status & Kirim Laporan</button>
      <div id="admin-msg" class="msg success">Status berhasil diperbarui!</div>
      <div id="admin-error" class="msg error">PIN salah atau laporan gagal!</div>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>

</html>
