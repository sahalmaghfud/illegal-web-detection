<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Diblokir</title>

    <style>
        :root {
            --danger-color: #ff3333;
            --danger-glow: rgba(255, 51, 51, 0.15);
            --bg-color: #050505;
            --surface-color: #0a0a0a;
            --border-red: #330000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(255, 51, 51, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.02) 1px, transparent 1px);
            background-size: 40px 40px, 40px 40px;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        /* Background grid only */

        .container {
            max-width: 480px;
            width: 90%;
            padding: 40px 30px;
            background: rgba(10, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-red);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 51, 51, 0.05);
            animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff3333, transparent);
            box-shadow: 0 0 10px #ff3333, 0 0 3px #ff3333;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            margin-bottom: 25px;
        }

        #char-image {
            max-width: 250px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 20px rgba(255, 51, 51, 0.2));
            animation: float 4s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.4), 0 0 20px rgba(255, 51, 51, 0.2);
        }

        p#warning-message {
            font-size: 16px;
            font-weight: 500;
            color: #ffb3b3;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .url-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #4d0000;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            max-width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .url-box::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #ff3333;
            border-radius: 8px 0 0 8px;
            box-shadow: 0 0 8px #ff3333;
        }

        .url-box svg {
            flex-shrink: 0;
            color: #ff4d4d;
            width: 20px;
            height: 20px;
        }

        .url-blocked {
            font-size: 15px;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
            color: #e6e6e6;
            word-break: break-all;
            text-align: left;
            line-height: 1.4;
        }

        .info {
            font-size: 14px;
            color: #999999;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .btn-close {
            background: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 700;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.1);
        }

        .btn-close:hover {
            background: rgba(255, 77, 77, 0.1);
            color: #ff6666;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.2);
            transform: translateY(-2px);
            border-color: #ff6666;
        }

        .btn-close:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon-wrapper">
            <img id="char-image" src="" alt="Character Image" style="display: none;">
        </div>

        <h1>Akses Diblokir</h1>
        <p id="warning-message">Situs ini terindikasi memiliki konten berbahaya!</p>

        <div class="url-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <div class="url-blocked" id="blocked-url"></div>
        </div>

        <div class="info">
            Koneksi ke situs ini telah diputus demi keamanan dan kenyamanan Anda. Anda tidak dapat melanjutkan ke
            halaman ini.
        </div>

        <button id="close-btn" class="btn-close">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
            Tutup Halaman
        </button>
    </div>

    <script src="../js/blocked.js"></script>
</body>

</html>
