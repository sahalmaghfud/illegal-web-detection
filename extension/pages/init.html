<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup PIN Ekstensi</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2c3e50;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .icon {
            background: #eef2f7;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: #007bff;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 26px;
            font-weight: 700;
        }

        p {
            color: #6c757d;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .warning-text {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 25px;
            border: 1px solid #ffeeba;
            text-align: left;
            line-height: 1.5;
        }

        input[type="password"] {
            width: 160px;
            padding: 12px;
            font-size: 28px;
            text-align: center;
            letter-spacing: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            display: block;
            background: #f8fafc;
            color: #1e293b;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15);
        }

        button {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
        </div>
        <h2>Setup PIN Keamanan</h2>
        <p>Silakan buat 4 digit PIN yang akan digunakan sebagai kontrol admin untuk mengubah status pemblokiran situs.
        </p>

        <div class="warning-text">
            <strong>⚠️ PERHATIAN:</strong><br>Harap ingat baik-baik PIN Anda. PIN ini bersifat permanen dan tidak dapat
            diubah di kemudian hari.
        </div>

        <div id="error-msg" class="error">PIN harus berupa 4 angka penuh.</div>
        <input type="password" id="pin-input" maxlength="4" placeholder="••••">
        <input type="password" id="pin-confirm" maxlength="4" placeholder="••••">
        <button id="save-btn" style="margin-top: 10px;">Simpan PIN</button>
    </div>
    <script src="../js/init.js"></script>
</body>

</html>
